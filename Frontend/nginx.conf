server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 ipv6=off;  # Add this to force IPv4

    # Forward API requests to the deployed backend
    location /api/ {
        proxy_pass https://campusconnect-bcew.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;  # Enable SNI
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable WebSocket support for API if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Forward Socket.IO requests to the deployed backend
    location /socket.io/ {
        proxy_pass https://campusconnect-bcew.onrender.com/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;  # Enable SNI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React routing fallback
    location / {
        try_files $uri /index.html;
    }
}