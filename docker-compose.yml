version: "3.9"
services:
  backend:
    build: ./Backend
    container_name: backend
    env_file:
      - ./Backend/.env
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build: ./Frontend
    container_name: frontend_container
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "5173:80"

networks:
  app-network:
    driver: bridge
